# sync-version: 1.0.1 - trigger rebuild with numpy and scikit-learn
services:
  # ─── AnubhavAI Backend Web Service ──────────────────────────────
  - type: web
    name: anubhavai-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: anubhavai-db
          property: connectionString

  # ─── AnubhavAI Frontend Static Site ─────────────────────────────
  - type: web
    name: anubhavai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: anubhavai-backend
          property: host

# ─── Managed PostgreSQL Database ─────────────────────────────────
databases:
  - name: anubhavai-db
    plan: free
    region: oregon
    databaseName: anubhavai
    user: anubhavai_user
